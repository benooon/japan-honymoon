<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ירח דבש · בן ורונית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ink:#12131a; --ink2:#454a57; --muted:#8b90a0; --line:#e8e9ee; --line2:#f1f2f6;
  --bg:#f7f7f9; --card:#fff;
  --jp:#6b5bd2; --th:#0a9ba8; --accent:#e0526e;
  --ok:#0f9d68; --okbg:#e8f7f0; --warn:#c77700; --warnbg:#fdf3e3;
  --r:16px; --r-sm:12px;
  --sh:0 1px 2px rgba(18,19,26,.05),0 4px 16px rgba(18,19,26,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.5;-webkit-font-smoothing:antialiased;font-size:15px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 100px}

/* ===== TOP BAR ===== */
.topbar{position:sticky;top:0;z-index:60;background:rgba(247,247,249,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.tb-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 0 10px}
.tb-title{font-weight:800;font-size:17px;letter-spacing:-.2px}
.tb-sub{font-size:12.5px;color:var(--muted);font-weight:500}
.tb-count{margin-right:auto;background:var(--ink);color:#fff;border-radius:30px;padding:6px 13px;
  font-size:12.5px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-family:inherit;
  font-weight:600;font-size:13.5px;padding:8px 15px;border-radius:30px;cursor:pointer;transition:.15s;white-space:nowrap}
.tab:hover{border-color:var(--muted)}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== DATE PILL STRIP (Wanderlog pattern) ===== */
.daystrip{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none;
  position:sticky;top:47px;z-index:50;background:rgba(247,247,249,.92);backdrop-filter:blur(10px);margin:0 -16px;padding-right:16px;padding-left:16px}
.daystrip::-webkit-scrollbar{display:none}
.dpill{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:7px 11px;cursor:pointer;text-align:center;min-width:54px;transition:.15s}
.dpill:hover{border-color:var(--muted)}
.dpill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dpill b{display:block;font-size:15px;font-weight:800;line-height:1.1}
.dpill span{font-size:10.5px;font-weight:600;opacity:.7}

/* ===== REGION HEADER ===== */
.reg{display:flex;align-items:center;gap:10px;margin:26px 0 4px}
.reg-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.reg h2{font-size:15px;font-weight:800;letter-spacing:-.2px}
.reg .n{font-size:12.5px;color:var(--muted);font-weight:600;margin-right:auto;white-space:nowrap}

/* ===== TIMELINE (Pangea pattern) ===== */
.tl{position:relative;padding-right:74px}
.tl::before{content:"";position:absolute;top:8px;bottom:8px;right:26px;width:2px;background:var(--line)}
.day{position:relative;margin-bottom:14px;scroll-margin-top:110px}
.day-rail{position:absolute;right:-74px;top:0;width:66px;text-align:center}
.day-node{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--jp);margin:5px auto 0;
  position:relative;right:-19px;z-index:2}
.day-rail .rl{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:5px;line-height:1.25}
.day-rail .rt{font-size:13px;font-weight:800;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.dhead{display:flex;align-items:flex-start;gap:11px;padding:14px 15px;cursor:pointer}
.dhead:hover{background:#fbfbfc}
.dnum{flex:0 0 auto;width:36px;height:36px;border-radius:10px;background:var(--line2);color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1}
.dnum b{font-size:14px}
.dnum span{font-size:8px;font-weight:700;opacity:.6;letter-spacing:.3px}
.dmain{flex:1;min-width:0}
.dtop{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dtop .dest{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.dwhen{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:1px}
.dhotel{font-size:13px;color:var(--ink2);font-weight:600;margin-top:5px;display:flex;align-items:center;gap:6px}
.chev{flex:0 0 auto;color:var(--muted);font-size:13px;transition:.25s;margin-top:9px}
.day.open .chev{transform:rotate(180deg)}
.dbody{max-height:0;overflow:hidden;transition:max-height .3s ease}
.dbody-in{padding:0 15px 15px}

/* badges */
.bdg{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;letter-spacing:.1px}
.bdg.ok{background:var(--okbg);color:var(--ok)}
.bdg.warn{background:var(--warnbg);color:var(--warn)}
.bdg.fly{background:#eeecfb;color:var(--jp)}
.bdg.bf{background:#e8f7f0;color:var(--ok)}
.bdg.nobf{background:var(--line2);color:var(--muted)}

/* ===== CONFIRMATION BOX (Booking.com pattern) ===== */
.confbox{border:1px solid #cfe9db;background:#f4fbf7;border-radius:var(--r-sm);padding:11px 13px;margin-bottom:11px}
.confbox.warnbox{border-color:#f0ddba;background:var(--warnbg)}
.confrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.confrow+.confrow{margin-top:5px}
.confrow b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.cbtn{background:none;border:none;cursor:pointer;font-size:12px;color:var(--jp);font-family:inherit;font-weight:700;padding:2px 5px;border-radius:5px}
.cbtn:hover{background:#eeecfb}
.cbtn.done{color:var(--ok)}

/* ===== CHECK-IN / OUT COLUMNS (Shangri-La pattern) ===== */
.inout{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-bottom:11px}
.inout>div{flex:1;padding:10px 12px}
.inout>div+div{border-right:1px solid var(--line)}
.inout .lab{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.inout .big{font-size:17px;font-weight:800;margin-top:1px;letter-spacing:-.3px}
.inout .tm{font-size:12px;color:var(--ink2);font-weight:600}

/* ===== DETAIL GRID (Navan pattern) ===== */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px 14px;
  padding:11px 0;border-top:1px solid var(--line2)}
.dgrid .k{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.dgrid .v{font-size:13.5px;font-weight:700;margin-top:1px}
.dgrid .v.sm{font-size:12.5px;font-weight:600;color:var(--ink2)}

/* ===== ACTION CHIP ROW (Pangea/Hyatt pattern) ===== */
.acts{display:flex;gap:7px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--ink);text-decoration:none;
  cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{border-color:var(--jp);color:var(--jp)}

/* ===== INFO BLOCKS ===== */
.blk{padding:11px 0;border-top:1px solid var(--line2)}
.blk .bt{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin-bottom:4px}
.blk .bc{font-size:13.5px;color:var(--ink2);line-height:1.55}
.note{background:var(--warnbg);border:1px solid #f0ddba;border-radius:var(--r-sm);padding:9px 12px;
  font-size:12.5px;color:#8a6a2f;margin-top:10px;font-weight:600}

/* ===== FLIGHT STRIP (Air NZ pattern) ===== */
.fly{background:linear-gradient(115deg,#514296,#7b6ad6);border-radius:var(--r-sm);padding:13px 15px;color:#fff;margin-bottom:11px}
.fly-t{font-size:11px;font-weight:700;opacity:.8;letter-spacing:.4px;margin-bottom:9px;display:flex;justify-content:space-between}
.fly-r{display:flex;align-items:center;gap:12px}
.fly-r .ap{font-size:20px;font-weight:800;letter-spacing:-.5px}
.fly-r .tm{font-size:11.5px;opacity:.85;font-weight:600;margin-top:1px}
.fly-r .mid{flex:1;text-align:center;font-size:10.5px;opacity:.8;font-weight:700}
.fly-r .mid::before{content:"";display:block;height:1px;background:rgba(255,255,255,.35);margin-bottom:4px}
.fly-code{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;opacity:.95}
.fly-code b{font-weight:800;letter-spacing:.4px}
.fly-code .cbtn{color:#fff}
.fly-code .cbtn:hover{background:rgba(255,255,255,.15)}

/* ===== STATS / PANELS ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:700}
.stat .v{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.panel h3{font-size:14.5px;font-weight:800;margin-bottom:2px}
.panel .ps{font-size:12.5px;color:var(--muted);margin-bottom:14px;font-weight:500}
.sec{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin:24px 0 10px}

/* ===== CHECKLIST ===== */
.pbar{height:8px;background:var(--line2);border-radius:20px;overflow:hidden;margin-top:9px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:20px;transition:width .5s}
.ck{display:flex;align-items:flex-start;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 14px;margin-bottom:7px;cursor:pointer;transition:.12s}
.ck:hover{border-color:var(--muted)}
.ck .box{flex:0 0 20px;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;margin-top:1px;transition:.15s}
.ck.done .box{background:var(--ok);border-color:var(--ok)}
.ck .t{flex:1}
.ck .t .tt{font-size:13.5px;font-weight:700}
.ck.done .t .tt{text-decoration:line-through;color:var(--muted);font-weight:600}
.ck .t .tn{font-size:12px;color:var(--muted);margin-top:2px}
.dl{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;align-self:center}
.dl.u{background:#fdeaee;color:var(--accent)}
.dl.s{background:var(--warnbg);color:var(--warn)}
.dl.c{background:var(--line2);color:var(--muted)}

/* ===== BUDGET ===== */
.bcat{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);margin-bottom:8px;overflow:hidden}
.bch{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;cursor:pointer;font-weight:800;font-size:14px}
.bch:hover{background:#fbfbfc}
.bci{display:none;padding:0 15px 8px}
.bcat.open .bci{display:block}
.bi{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line2);font-size:13px}
.bi .n{flex:1;font-weight:600;color:var(--ink2)}
.bi .n s{display:block;font-size:11.5px;color:var(--muted);text-decoration:none;font-weight:500;margin-top:1px}
.bi .a{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.total{background:var(--ink);color:#fff;border-radius:var(--r);padding:18px 20px;display:flex;
  justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.total .l{font-size:12.5px;opacity:.7;font-weight:600}
.total .v{font-size:27px;font-weight:800;letter-spacing:-.6px}

/* ===== MAP ===== */
#mapEl{height:66vh;min-height:400px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);z-index:1}
.mlg{display:flex;flex-wrap:wrap;gap:8px 15px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 15px;margin-top:11px;font-size:12.5px;font-weight:600}
.mlg span{display:flex;align-items:center;gap:6px}
.mlg i{width:11px;height:11px;border-radius:50%}
.map-pin{display:flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);box-shadow:0 2px 5px rgba(0,0,0,.3);border:2px solid #fff;font-weight:800;color:#fff;font-size:11px}
.map-pin b{transform:rotate(45deg)}
.poi-food{width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:#fff;
  border:2px solid var(--accent);border-radius:50%;font-size:10px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.leaflet-popup-content{font-family:'Heebo',sans-serif;direction:rtl;text-align:right;margin:11px 13px;font-size:13px}
.pop-t{font-weight:800;font-size:14.5px}
.pop-s{font-size:11.5px;color:var(--muted);margin:2px 0 6px;font-weight:600}
.pop-r{font-size:12.5px;margin:2px 0;font-weight:600;color:var(--ink2)}
.pop-go{display:inline-block;margin-top:8px;background:var(--ink);color:#fff;text-decoration:none;
  font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:8px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:30px;font-weight:500}
</style>
</head>

</div>

  $('#mapf').innerHTML='<button class="tab active" data-t="hotel">🏨 מלונות</button><button class="tab active" data-t="sight">📸 אתרים</button>'+
    '<button class="tab active" data-t="food">🍽️ מסעדות</button><button class="tab" data-z="jp">🌸 יפן</button>'+
    '<button class="tab" data-z="th">🌴 תאילנד</button><button class="tab" data-z="all">🌏 הכל</button>';
  $$('#mapf .tab').forEach(b=>b.onclick=()=>{
    if(b.dataset.t){b.classList.toggle('active');
      b.classList.contains('active')?lay[b.dataset.t].addTo(LM):LM.removeLayer(lay[b.dataset.t]);}
    else{const z=b.dataset.z;let q=pts;if(z==='jp')q=pts.filter(p=>p[0]>20);if(z==='th')q=pts.filter(p=>p[0]<20);
      LM.fitBounds(q,{padding:[35,35]});}});
  setTimeout(()=>LM.invalidateSize(),200);
}
</script>
</body>
</html>
